<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="620" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- initial state -->
  <circle cx="22" cy="150" r="8" fill="#000"/>
  <path stroke="#000000" stroke-width="1.2" fill="none" d="M30,150 L98,150" marker-end="url(#a2)"/>
  <text font-size="10" font-style="italic" x="28" y="138">book</text>
  <text font-size="10" font-style="italic" x="28" y="170">(free bay)</text>

  <!-- states -->
  <rect fill="#ffffff" stroke="#000000" stroke-width="1.3" x="100" y="30" width="130" height="40" rx="18"/>
  <text text-anchor="middle" font-weight="bold" x="165" y="54">SCHEDULED</text>

  <rect fill="#ffffff" stroke="#000000" stroke-width="1.3" x="100" y="130" width="130" height="40" rx="18"/>
  <text text-anchor="middle" font-weight="bold" x="165" y="154">CONFIRMED</text>

  <rect fill="#ffffff" stroke="#000000" stroke-width="1.3" x="320" y="130" width="130" height="40" rx="18"/>
  <text text-anchor="middle" font-weight="bold" x="385" y="154">IN_PROGRESS</text>

  <rect fill="#e8e8e8" stroke="#000000" stroke-width="1.3" x="540" y="130" width="130" height="40" rx="18"/>
  <text text-anchor="middle" font-weight="bold" x="605" y="154">COMPLETED</text>

  <rect fill="#e8e8e8" stroke="#000000" stroke-width="1.3" x="320" y="240" width="130" height="40" rx="18"/>
  <text text-anchor="middle" font-weight="bold" x="385" y="264">CANCELLED</text>

  <rect fill="#e8e8e8" stroke="#000000" stroke-width="1.3" x="540" y="240" width="130" height="40" rx="18"/>
  <text text-anchor="middle" font-weight="bold" x="605" y="264">NO_SHOW</text>

  <!-- transitions -->
  <path stroke="#000000" stroke-width="1.2" fill="none" d="M165,70 L165,128" marker-end="url(#a2)"/>
  <text font-size="10" font-style="italic" x="172" y="104">confirm (admin)</text>

  <path stroke="#000000" stroke-width="1.2" fill="none" d="M230,150 L318,150" marker-end="url(#a2)"/>
  <text font-size="10" font-style="italic" x="236" y="128">start (operator,</text>
  <text font-size="10" font-style="italic" x="236" y="140">booking day)</text>

  <path stroke="#000000" stroke-width="1.2" fill="none" d="M450,150 L538,150" marker-end="url(#a2)"/>
  <text font-size="10" font-style="italic" x="458" y="140">finish (operator)</text>

  <path stroke="#000000" stroke-width="1.2" fill="none" d="M190,170 L330,240" marker-end="url(#a2)"/>
  <text font-size="10" font-style="italic" x="160" y="222">cancel: customer before</text>
  <text font-size="10" font-style="italic" x="160" y="235">the start time, or admin</text>

  <path stroke="#000000" stroke-width="1.2" fill="none" d="M215,170 C330,200 470,215 560,240" marker-end="url(#a2)"/>
  <text font-size="10" font-style="italic" x="470" y="208">no show (admin)</text>
</svg>
